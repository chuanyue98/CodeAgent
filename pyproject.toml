[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "A professional AI-driven agent for automated coding and task execution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "click>=8.0.0",
    "croniter>=2.0.0",
    "fastapi>=0.115.0",
    "mcp>=1.28",
    "packaging==26.2",
    "pathspec==1.1.1",
    "psutil>=6.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "questionary>=2.0.0",
    "requests==2.34.2",
    "tomlkit>=0.12.0",
    "uvicorn>=0.30.0",
    "websockets>=15.0",
]

[project.scripts]
ca = "ca_launcher:main"

[tool.setuptools]
py-modules = ["ca_launcher"]

[tool.setuptools.packages.find]
include = ["core*", "engines*"]
namespaces = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "freezegun==1.5.5",
    "httpx>=0.28.1",
    "iniconfig==2.3.0",
    "mypy==2.3.1",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
    "pylint==4.0.6",
    "ruff>=0.15.4",
    "types-croniter>=2.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff.lint]
# E4/E7/E9 + F: ruff's own implicit default rule set, made explicit here so
# it's versioned rather than relying on ruff's defaults changing under us.
# Deliberately not the full E family: E501 (line-too-long) isn't enabled --
# turning it on would need a separate pass to rewrap ~90 existing lines,
# which is a line-length style decision, not part of this inspection.
# I: import sorting -- previously unenforced, which let import order drift
#    (see the 2026-07-28 engineering inspection). B: common bug patterns.
# UP: pyupgrade -- converts old-style Optional[X]/Union[X, None]/List[X] to
#    X | None / list[X] now that the project targets Python >= 3.13 throughout.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    # str+Enum -> enum.StrEnum: agent_protocol.py's enums round-trip through
    # pydantic camelCase JSON serialization; StrEnum's __str__/__format__
    # differs subtly from the (str, Enum) mixin, so converting is a wire-
    # format-affecting change deliberately left out of this lint-only pass.
    "UP042",
    # pytest.raises(Exception) in one existing test -- narrowing it to the
    # precise exception type is a test-quality improvement, not a lint fix.
    "B017",
    # %-formatting building a JSON fixture string with literal { }: an
    # f-string equivalent needs brace-doubling that's easy to get subtly
    # wrong for low value on a single test fixture.
    "UP031",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# A per-test ceiling, so a wedged PTY reader or a websocket that never gets
# its event fails one test instead of hanging the CI job to its own timeout.
# The slowest honest test today is ~10s (an adapter's kill-then-reap wait).
timeout = 60

[tool.coverage.run]
# Without an explicit source, `coverage` measures whatever gets imported --
# which includes tests/ itself. Test files run top to bottom, so they score
# near 100% and drag the total up: the suite reported 84% while the code it
# exercises sat at 75%, and fail_under was gating on the wrong number.
source = ["core", "engines", "ca_launcher.py"]

[tool.coverage.report]
# Measured over shipped code only (see [tool.coverage.run] above). A ratchet
# floor, not a target: raise it as coverage climbs. It sits a point under the
# current ~77% because threaded code (the PTY reader, the scheduler loop) hits
# a slightly different line set per run -- observed spread is 77.44-77.86, so
# a floor at 77 would flake.
fail_under = 76
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
