[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "A professional AI-driven agent for automated coding and task execution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "packaging==26.0",
    "pathspec==0.12.1",
    "pre-commit==4.5.1",
    "pylint==4.0.4",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "uvicorn>=0.30.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.scripts]
ca = "ca_launcher:main"

[tool.setuptools]
packages = ["core", "engines", "core.web"]
py-modules = ["ca_launcher"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage==7.13.2",
    "freezegun==1.5.1",
    "httpx>=0.28.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.0.0",
    "ruff>=0.15.4",
]
