[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "A professional AI-driven agent for automated coding and task execution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "click>=8.0.0",
    "croniter>=2.0.0",
    "fastapi>=0.115.0",
    "packaging==26.2",
    "pathspec==1.1.1",
    "psutil>=6.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "tomlkit>=0.12.0",
    "uvicorn>=0.30.0",
    "websockets>=15.0",
]

[project.scripts]
ca = "ca_launcher:main"

[tool.setuptools]
py-modules = ["ca_launcher"]

[tool.setuptools.packages.find]
include = ["core*", "engines*"]
namespaces = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "freezegun==1.5.5",
    "httpx>=0.28.1",
    "iniconfig==2.3.0",
    "mypy==2.3.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
    "pylint==4.0.6",
    "ruff>=0.15.4",
    "types-croniter>=2.0.0",
]
