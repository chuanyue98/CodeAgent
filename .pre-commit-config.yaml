# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (core/engines/ca_launcher)
        entry: uv run mypy core engines ca_launcher.py
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast, no coverage)
        entry: uv run pytest -q --tb=line -x -k "not slow"
        language: system
        types: [python]
        pass_filenames: false
