name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Python backend ────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true   # caches ~/.cache/uv between runs

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # --frozen honours uv.lock; --all-groups pulls in the [dependency-groups.dev] deps
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Lint the whole repo rather than a hand-maintained path list. The list
      # left skills/ (and hooks/, plugins/) unchecked, and since pre-commit
      # only sees changed files, 7 violations sat there untouched through a
      # repo-wide lint normalization. ruff honours .gitignore, so vendored
      # trees like node_modules stay out on their own.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy core engines ca_launcher.py

      - name: Test
        run: uv run pytest --tb=short -q --cov --cov-report=term-missing

  # ── React / Vite frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v7

      # Bun is the primary package manager (bun.lock is committed)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (Vitest)
        run: bun run test

      - name: Dependency audit
        run: bun audit --production

      - name: Build (tsc + Vite)
        run: bun run build

      - name: Bundle size budget
        run: test "$(du -sk dist | cut -f1)" -le 2048

      - name: Upload production UI
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/frontend/dist/
          retention-days: 1

  # ── Release artifacts use the frontend built and tested above ────────────
  package:
    name: Package — wheel with current UI
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Replace committed UI with tested artifact
        run: rm -rf web/frontend/dist

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist

      - name: Build wheel and verify runtime assets
        run: |
          uv build --wheel --out-dir /tmp/codeagent-dist
          python -c "import zipfile; from pathlib import Path; wheel=next(Path('/tmp/codeagent-dist').glob('*.whl')); names=set(zipfile.ZipFile(wheel).namelist()); required=('prompt/base/general.basic.md','skills/base/skill-creator/SKILL.md','web/frontend/dist/index.html'); assert all(any(name.endswith(item) for name in names) for item in required)"

      - uses: actions/upload-artifact@v7
        with:
          name: codeagent-wheel
          path: /tmp/codeagent-dist/*.whl

  container:
    name: Package — Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Replace committed UI with tested artifact
        run: rm -rf web/frontend/dist
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist
      - name: Build image
        run: docker build -t codeagent:ci .

  # ── Playwright E2E (real backend, real browser, fake engine CLIs) ─────────
  e2e:
    name: E2E — Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --frozen --all-groups
        working-directory: .

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The frontend job already built and tested this exact dist; download
      # it instead of rebuilding (tsc -b && vite build is ~1 minute of the
      # e2e job's wall time for a byte-identical result).
      - name: Replace committed UI with tested artifact
        run: rm -rf web/frontend/dist
        working-directory: .

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/frontend/bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bunx playwright test --reporter=dot

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 14
