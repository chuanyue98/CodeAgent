name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Python backend ────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true   # caches ~/.cache/uv between runs

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --frozen honours uv.lock; --all-groups pulls in the [dependency-groups.dev] deps
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check ca_launcher.py core engines tests

      - name: Format check (ruff)
        run: uv run ruff format --check ca_launcher.py core engines tests

      - name: Type check (mypy)
        run: uv run mypy core engines ca_launcher.py

      - name: Test
        run: uv run pytest --tb=short -q --cov --cov-report=term-missing

  # ── React / Vite frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      # Bun is the primary package manager (bun.lock is committed)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (Vitest)
        run: bun run test

      - name: Dependency audit
        run: bun audit --production

      - name: Build (tsc + Vite)
        run: bun run build

  # ── Playwright E2E (real backend, real browser, fake engine CLIs) ─────────
  e2e:
    name: E2E — Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --frozen --all-groups
        working-directory: .

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc + Vite)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 14

  # ── Claude Code Review ───────────────────────────────────────────────────
  claude-review:
    name: Claude Code Review
    needs: [backend, frontend]
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
