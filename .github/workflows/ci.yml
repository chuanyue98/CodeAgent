name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Python backend ────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true   # caches ~/.cache/uv between runs

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen honours uv.lock; --all-groups pulls in the [dependency-groups.dev] deps
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check ca_launcher.py core engines tests setup.py

      - name: Format check (ruff)
        run: uv run ruff format --check ca_launcher.py core engines tests setup.py

      - name: Type check (mypy)
        run: uv run mypy core engines ca_launcher.py

      - name: Test
        run: uv run pytest --tb=short -q --cov --cov-report=term-missing

      - name: Build wheel and verify runtime assets
        run: |
          uv build --wheel --out-dir /tmp/codeagent-dist
          uv run python -c "import zipfile; from pathlib import Path; wheel=next(Path('/tmp/codeagent-dist').glob('*.whl')); names=set(zipfile.ZipFile(wheel).namelist()); required=('prompt/base/general.basic.md','skills/base/skill-creator/SKILL.md','web/frontend/dist/index.html'); assert all(any(name.endswith(item) for name in names) for item in required)"

  # ── React / Vite frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      # Bun is the primary package manager (bun.lock is committed)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (Vitest)
        run: bun run test

      - name: Dependency audit
        run: bun audit --production

      - name: Build (tsc + Vite)
        run: bun run build

  # ── Playwright E2E (real backend, real browser, fake engine CLIs) ─────────
  e2e:
    name: E2E — Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --frozen --all-groups
        working-directory: .

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build (tsc + Vite)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 14

