name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── Python backend ────────────────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true   # caches ~/.cache/uv between runs

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --frozen honours uv.lock; --all-groups pulls in the [dependency-groups.dev] deps
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uvx ruff@0.15.4 check ca_launcher.py core engines tests

      - name: Format check (ruff)
        run: uvx ruff@0.15.4 format --check ca_launcher.py core engines tests

      - name: Test
        run: uv run pytest --tb=short -q --cov --cov-report=term-missing

  # ── React / Vite frontend ─────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      # Bun is the primary package manager (bun.lock is committed)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (Vitest)
        run: bun run test

      - name: Build (tsc + Vite)
        run: bun run build
